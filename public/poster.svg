<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121A26"/>
      <stop offset="0.55" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#16202E"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(360 240) rotate(28) scale(520 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6E93BE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6E93BE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(960 520) rotate(-24) scale(480 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#96B4D6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#96B4D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF1F8"/>
      <stop offset="0.5" stop-color="#96B4D6"/>
      <stop offset="1" stop-color="#49688F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF1F8" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#EAF1F8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#EAF1F8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glowA)"/>
  <rect width="1280" height="720" fill="url(#glowB)"/>

  <!-- grid -->
  <g stroke="#223047" stroke-width="1" opacity="0.5">
    <path d="M0 90H1280M0 180H1280M0 270H1280M0 360H1280M0 450H1280M0 540H1280M0 630H1280"/>
    <path d="M100 0V720M240 0V720M380 0V720M520 0V720M660 0V720M800 0V720M940 0V720M1080 0V720M1220 0V720"/>
  </g>

  <!-- floating module cards -->
  <g opacity="0.9">
    <rect x="118" y="168" width="212" height="72" rx="12" fill="#16202E" stroke="#223047"/>
    <circle cx="146" cy="204" r="5" fill="#00BB7F"/>
    <rect x="164" y="196" width="104" height="8" rx="4" fill="#93A9C2" opacity="0.65"/>
    <rect x="164" y="212" width="62" height="6" rx="3" fill="#49688F"/>

    <rect x="962" y="252" width="212" height="72" rx="12" fill="#16202E" stroke="#223047"/>
    <circle cx="990" cy="288" r="5" fill="#F99C00"/>
    <rect x="1008" y="280" width="96" height="8" rx="4" fill="#93A9C2" opacity="0.65"/>
    <rect x="1008" y="296" width="72" height="6" rx="3" fill="#49688F"/>

    <rect x="172" y="452" width="196" height="66" rx="12" fill="#121A26" stroke="#223047" opacity="0.85"/>
    <circle cx="200" cy="485" r="5" fill="#00BB7F"/>
    <rect x="218" y="477" width="88" height="8" rx="4" fill="#93A9C2" opacity="0.55"/>
    <rect x="218" y="493" width="56" height="6" rx="3" fill="#49688F"/>
  </g>

  <!-- center wordmark -->
  <g transform="translate(432 236)">
    <path d="M52 0 88 20v42L52 82 16 62V20L52 0Z" fill="none" stroke="url(#steel)" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M40 24v34M40 41l22-17M42 40l24 18" fill="none" stroke="url(#steel)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="640" y="392" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.4" fill="url(#steel)">Krypton</text>
  <text x="640" y="436" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="21" font-weight="500" letter-spacing="0.6" fill="#93A9C2">82+ modules · Undetected · Built for DonutSMP</text>

  <!-- HUD bar -->
  <rect x="500" y="486" width="280" height="44" rx="22" fill="#121A26" stroke="#223047"/>
  <circle cx="530" cy="508" r="5" fill="#00BB7F"/>
  <text x="546" y="513" font-family="Sora, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#EAF1F8">Right Shift to open GUI</text>

  <rect x="0" y="660" width="1280" height="60" fill="url(#sheen)"/>
