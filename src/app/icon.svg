<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Cracked Krypton</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2534" />
      <stop offset="1" stop-color="#0A0E14" />
    </linearGradient>
    <linearGradient id="steel" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF1F8" />
      <stop offset="0.5" stop-color="#96B4D6" />
      <stop offset="1" stop-color="#6E93BE" />
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" />
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="6.4" fill="none" stroke="#223047" stroke-width="1.2" />

  <!-- K -->
  <g stroke="url(#steel)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M10.5 7.5v17" />
    <path d="M20.5 8 12.4 16.2" />
    <path d="M12.6 15.4 21 24.5" />
  </g>

  <!-- crack -->
  <g stroke="#EAF1F8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M26.5 5.5 23.2 11l2.4 1.5-2.7 3.4" />
  </g>
</svg>
